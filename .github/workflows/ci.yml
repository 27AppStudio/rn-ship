name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: rspec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Git identity for the git_release specs
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: bundle exec rspec

  actions:
    name: composite actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $tarball" | sha256sum --check
          tar -xzf "$tarball" actionlint
      # Once as published, once against ./actions so every input passed is checked against
      # the action's own definition.
      - name: Lint the example workflow
        run: |
          ./actionlint examples/deploy.yml
          sed 's|27AppStudio/rn-ship/actions/\([a-z-]*\)@v[0-9.]*|./actions/\1|' examples/deploy.yml > .github/workflows/example-local.yml
          ./actionlint .github/workflows/example-local.yml
      - name: notify (dry run on a real runner)
        uses: ./actions/notify
        env:
          NOTIFY_PRINT: "1"
        with:
          status: success
          title: rn-ship CI
